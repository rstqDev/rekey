name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Fetch corpora
        shell: bash
        run: ./tools/fetch_corpora.sh

      - name: Build language models
        run: cargo run --release -p modelgen -- tools/.cache crates/rekey-core/data/models

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the app
        run: cargo tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: rekey-${{ matrix.target }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
          body: |
            ## Installing

            **macOS** — open the `.dmg`, drag Rekey to Applications, then grant
            **Accessibility** access (System Settings → Privacy & Security →
            Accessibility) and relaunch. These builds are not notarized yet, so
            the first launch needs right-click → Open.

            **Windows** — run the installer. No special permissions needed.
