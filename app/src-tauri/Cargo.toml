[package]
name = "rekey-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rekey — fixes text typed on the wrong keyboard layout."
default-run = "rekey"

[[bin]]
name = "rekey"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rekey-core = { workspace = true }
rekey-hook = { workspace = true }
rekey-ai = { workspace = true }
# macos-private-api is what allows a transparent window, which is in turn what
# lets the system's vibrancy material show behind the content. It rules out the
# Mac App Store — which Rekey cannot ship to anyway, since App Store sandboxing
# forbids the keyboard access the whole app depends on.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
dirs = "6"

[features]
# Tauri's default production behaviour; kept explicit for the release build.
custom-protocol = ["tauri/custom-protocol"]
