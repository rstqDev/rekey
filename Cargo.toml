[workspace]
resolver = "2"
members = [
    "crates/rekey-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/rostislavladnov/rekey"
authors = ["Rostislav Ladnov"]

[workspace.dependencies]
rekey-core = { path = "crates/rekey-core" }
rekey-hook = { path = "crates/rekey-hook" }
rekey-ai = { path = "crates/rekey-ai" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
